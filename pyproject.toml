[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemonbot"
version = "1.0.0"
description = "Product availability monitor with proxy rotation and multi-site support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "aiohttp>=3.9,<4",
    "aiohttp-socks>=0.8,<1",
    "Brotli>=1.1,<2",
    "curl_cffi>=0.7,<1",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
    "rich>=13.0,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-aiohttp>=1.0,<2",
    "aioresponses>=0.7,<1",
]

[project.scripts]
pokemonbot = "pokemonbot.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pokemonbot*"]
